name: Deploy docs to Pages

# フォーク (GitHub Pages) での運用メモ:
#   - デプロイ元は GitHub Actions。リポジトリ設定 → Pages → Source を
#     "GitHub Actions" にする (または gh api --method POST repos/{...}/pages
#     -f build_type=workflow で有効化)
#   - サイトの URL は mkdocs.yml の site_url が正となる (フォークでは
#     https://<owner>.github.io/krkrz_dev/)
#   - 翻訳 (doc/zh/) は krkrz-doc-zh スキルの check_pair.py が構造を検証済み

on:
  push:
    branches: [develop, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install mkdocs
        run: pip install -r tools/docgen/requirements.txt

      - name: Build site
        run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
