site_name: 吉里吉里Z ドキュメント
site_description: 吉里吉里Z (Kirikiri Z) の TJS2 リファレンス・ガイド・仕様書
site_url: https://aetherkiri.github.io/krkrz_dev/  # 本 fork 的 GitHub Pages（Actions 部署）
repo_url: https://github.com/AetherKiri/krkrz_dev
repo_name: AetherKiri/krkrz_dev
edit_uri: edit/master/doc/
copyright: "(c) Kirikiri Z Project / Wamsoft Ltd. Partnership"

docs_dir: doc

validation:
  anchors: warn

# ブラウザ実行デモ (doc/_assets/demo) を iframe 埋め込みで動かすため、全ページで
# coi-serviceworker を登録し crossOriginIsolated (SharedArrayBuffer) を成立させる。
# GitHub Pages は COOP/COEP ヘッダを設定できないため、SW でクライアント側に注入する。
# 既定 COEP=credentialless なので外部リソース (テーマのフォント等) は壊れにくい。
extra_javascript:
  - coi-serviceworker.js

theme:
  name: material
  language: ja
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-night
        name: ダークモードに切替
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: ライトモードに切替
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

plugins:
  - search:
      lang: ja
      separator: '[\s\-,:!=\[\]()"/]+|\.(?!\d)|&[lg]t;'
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: ja
          default: true
          name: 日本語
          build: true
        - locale: zh
          name: 简体中文
          build: true
          site_name: 吉里吉里Z 文档
          site_description: 吉里吉里Z (Kirikiri Z) 的 TJS2 参考文档・指南・规格文档（简体中文）
          theme:
            language: zh
          nav_translations:
            ホーム: 首页
            デモ: 演示
